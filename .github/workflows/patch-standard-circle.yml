name: Patch standard circle camera

on:
  push:
    branches:
      - feat/standard-circle-and-addition-lock

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[camera-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standard-circle-and-addition-lock
          fetch-depth: 0

      - name: Patch LabApp camera orientation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/LabApp.tsx')
          text = path.read_text()

          old_camera = """  circle: {\n    position: { x: -0.65, y: 0, z: 0 },\n    target: { x: BOX_LENGTH, y: 0, z: 0 },\n    up: { x: 0, y: 0, z: 1 },\n    focal: 980,\n  },"""
          new_camera = """  circle: {\n    position: { x: BOX_LENGTH + 5.2, y: 0, z: 0 },\n    target: { x: BOX_LENGTH, y: 0, z: 0 },\n    up: { x: 0, y: 0, z: 1 },\n    focal: 980,\n  },"""
          if old_camera not in text:
              raise SystemExit('circle camera block not found')
          text = text.replace(old_camera, new_camera, 1)

          old_tick = """      setCameraState({\n        pose: lerpCamera(from.pose, targetPose, eased),\n        isolation: lerp(from.isolation, targetIsolation, eased),\n      })"""
          new_tick = """      const interpolatedPose = lerpCamera(from.pose, targetPose, eased)\n      if (targetView === 'circle' || view === 'circle') {\n        const detour = Math.sin(Math.PI * eased)\n        interpolatedPose.position = {\n          ...interpolatedPose.position,\n          y: interpolatedPose.position.y - detour * 5.6,\n          z: interpolatedPose.position.z + detour * 1.5,\n        }\n      }\n      setCameraState({\n        pose: interpolatedPose,\n        isolation: lerp(from.isolation, targetIsolation, eased),\n      })"""
          if old_tick not in text:
              raise SystemExit('camera animation block not found')
          text = text.replace(old_tick, new_tick, 1)

          path.write_text(text)
          PY

      - name: Commit camera patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/LabApp.tsx
          git commit -m "fix: use standard unit-circle orientation [camera-patched]"
          git push origin HEAD:feat/standard-circle-and-addition-lock
