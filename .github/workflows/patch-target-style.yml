name: Patch target style

on:
  push:
    branches:
      - feat/standard-circle-and-addition-lock

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[target-style-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standard-circle-and-addition-lock
          fetch-depth: 0
      - name: Remove CSS typed-arithmetic dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/VectorAdditionLayer.tsx')
          text = path.read_text()
          old = "style={{ '--target-progress': targetProgress } as React.CSSProperties}"
          new = "style={{ opacity: 0.48 + targetProgress * 0.52 }}"
          if old not in text:
              raise SystemExit('target style marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit target style patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/VectorAdditionLayer.tsx
          git commit -m "fix: use direct target opacity [target-style-patched]"
          git push origin HEAD:feat/standard-circle-and-addition-lock
